services:
  postgres:
    image: 'postgres:16'
    container_name: kuroscans-postgres
    environment:
      POSTGRES_DB: kuroscans_db
      POSTGRES_USER: kuroscans
      POSTGRES_PASSWORD: kuroscans123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: 'redis:7-alpine'
    container_name: kuroscans-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: kuroscans-minio
    environment:
      MINIO_ROOT_USER: kuroscans
      MINIO_ROOT_PASSWORD: kuroscans123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: